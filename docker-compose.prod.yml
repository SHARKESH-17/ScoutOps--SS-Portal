# ScoutOps - PRODUCTION stack (Ubuntu / AWS EC2).
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
# All credentials come from .env or the environment - nothing is hardcoded.
# Image tag comes from SCOUTOPS_VERSION (e.g. 1.0.7) so rollback.sh can switch versions.
# Stop the local stack first (docker compose down): both use the same container names and port.
services:
  scoutops-app:
    build:
      context: .
    image: scoutops:${SCOUTOPS_VERSION:-1.0.0}
    container_name: scoutops-app
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scoutops-prod-net
      - scoutops-prod-db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: scoutops-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - scoutops_prod_pgdata:/var/lib/postgresql/data
      - /home/ubuntu/scoutops-db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - scoutops-prod-db   # internal only: PostgreSQL is never published to the host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  scoutops_prod_pgdata:
    name: scoutops_prod_pgdata

networks:
  scoutops-prod-net:
    name: scoutops-prod-net
  scoutops-prod-db:
    name: scoutops-prod-db
    internal: true
