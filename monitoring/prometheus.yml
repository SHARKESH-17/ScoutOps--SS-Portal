global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: scoutops
    metrics_path: /metrics
    static_configs:
      - targets: ["scoutops-app:3000"]   # Docker service/container name on the shared network

  - job_name: prometheus
    static_configs:
      - targets: ["3.111.55.71:9090"]
