groups:
  - name: scoutops
    rules:
      - alert: ScoutOpsApplicationDown
        expr: up{job="scoutops"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ScoutOps application is unavailable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for more than 1 minute."

      - alert: ScoutOpsHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="scoutops",status_code=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="scoutops"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ScoutOps is returning many 5xx errors"
          description: "More than 5% of requests failed with a 5xx status over the last 5 minutes (currently {{ $value | humanizePercentage }})."

      - alert: ScoutOpsHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="scoutops"}[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ScoutOps response latency is high"
          description: "The 95th percentile request latency has been above 1 second for 5 minutes (currently {{ $value | humanizeDuration }})."
