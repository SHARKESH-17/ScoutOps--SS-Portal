<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCOUTOPS | Find. Track. Resolve.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232dd4bf' stroke-width='2'/%3E%3Cpath d='M16 5l4 11-4 11-4-11z' fill='%232dd4bf'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b1117;--panel:#121b24;--panel2:#18232f;--line:#243241;--text:#e6edf3;--muted:#8b9bab;--accent:#2dd4bf;--accent2:#f59e0b;
--low:#64748b;--medium:#3b82f6;--high:#f59e0b;--critical:#ef4444;--ok:#22c55e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#10303a55,transparent),var(--bg);color:var(--text);
font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{border-bottom:1px solid var(--line);background:#0d151cdd;position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{margin:0;font-size:1.5rem;letter-spacing:.28em;font-weight:700}
.brand p{margin:0;color:var(--accent);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
.health{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:999px;font-size:.75rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.up .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.down .dot{background:var(--critical);box-shadow:0 0 8px var(--critical)}
main{padding:24px 0 48px}
.mission{color:var(--muted);margin:0 0 20px;font-style:italic}
h2{font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.stat{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:14px 16px}
.stat .n{font-size:1.9rem;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.stat.crit{border-left-color:var(--critical)}.stat.warn{border-left-color:var(--accent2)}.stat.good{border-left-color:var(--ok)}
.grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-size:.75rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;font-size:.92rem}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:6px;font:inherit;font-size:.88rem}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#04201c;border-color:var(--accent);font-weight:600}
button.danger:hover{border-color:var(--critical);color:var(--critical)}
button:disabled{opacity:.55;cursor:not-allowed}
.small{padding:5px 9px;font-size:.78rem}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{width:auto;padding:6px 8px;font-size:.8rem}
.issue{border:1px solid var(--line);border-left:4px solid var(--low);background:var(--panel2);border-radius:8px;padding:14px;margin-bottom:10px}
.issue.p-MEDIUM{border-left-color:var(--medium)}.issue.p-HIGH{border-left-color:var(--high)}.issue.p-CRITICAL{border-left-color:var(--critical)}
.issue h3{margin:0 0 4px;font-size:1rem}
.issue .desc{color:var(--muted);font-size:.88rem;margin:4px 0 8px;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-bottom:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;letter-spacing:.08em;font-weight:600;border:1px solid var(--line)}
.t-LOW{color:var(--low)}.t-MEDIUM{color:var(--medium)}.t-HIGH{color:var(--high)}.t-CRITICAL{color:var(--critical)}
.s-OPEN{color:#38bdf8}.s-ASSIGNED{color:#a78bfa}.s-IN_PROGRESS{color:var(--accent2)}.s-RESOLVED{color:var(--ok)}.s-CLOSED{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions select{width:auto;padding:5px 8px;font-size:.78rem}
.empty,.loading{text-align:center;color:var(--muted);padding:36px 10px;border:1px dashed var(--line);border-radius:8px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:20;max-width:calc(100% - 32px)}
.msg{padding:10px 14px;border-radius:8px;border:1px solid;background:var(--panel);font-size:.88rem;box-shadow:0 6px 20px #0008}
.msg.ok{border-color:var(--ok)}.msg.err{border-color:var(--critical)}
footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:.78rem;padding:18px}
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="#2dd4bf" stroke-width="2"/><circle cx="24" cy="24" r="15" fill="none" stroke="#243241" stroke-width="1" stroke-dasharray="2 3"/><path d="M24 7l6 17-6 17-6-17z" fill="#2dd4bf" opacity=".9"/><path d="M24 7l-6 17h12z" fill="#f59e0b"/><circle cx="24" cy="24" r="2.5" fill="#0b1117"/></svg>
      <div><h1>SCOUTOPS</h1><p>Find. Track. Resolve.</p></div>
    </div>
    <div class="health" aria-live="polite">
      <span class="pill" id="h-app"><span class="dot"></span>API: checking</span>
      <span class="pill" id="h-db"><span class="dot"></span>Database: checking</span>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="mission">Every issue has a mission.</p>

  <h2>Dashboard</h2>
  <section class="stats" id="stats" aria-label="Issue statistics"></section>

  <div class="grid">
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Report an issue</h2>
      <form id="issue-form" novalidate>
        <input type="hidden" id="f-id">
        <label for="f-title">Title</label>
        <input id="f-title" maxlength="150" required placeholder="e.g. Projector not turning on">
        <label for="f-desc">Description</label>
        <textarea id="f-desc" maxlength="2000" placeholder="What did you observe?"></textarea>
        <div class="row">
          <div><label for="f-category">Category</label><select id="f-category"></select></div>
          <div><label for="f-priority">Priority</label><select id="f-priority"></select></div>
        </div>
        <label for="f-location">Location</label>
        <input id="f-location" maxlength="150" required placeholder="e.g. Block A, Room 204">
        <label for="f-reporter">Reporter name</label>
        <input id="f-reporter" maxlength="100" required placeholder="Your name">
        <div id="status-wrap" hidden>
          <label for="f-status">Status</label><select id="f-status"></select>
        </div>
        <div class="btns">
          <button type="submit" class="primary" id="f-submit">Report issue</button>
          <button type="button" id="f-cancel" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="toolbar">
        <h2 id="list-title" style="margin:0">Issues</h2>
        <div class="filters">
          <select id="flt-status" aria-label="Filter by status"><option value="">All statuses</option></select>
          <select id="flt-priority" aria-label="Filter by priority"><option value="">All priorities</option></select>
          <select id="flt-category" aria-label="Filter by category"><option value="">All categories</option></select>
          <button class="small" id="refresh" type="button">Refresh</button>
        </div>
      </div>
      <div id="list"></div>
    </section>
  </div>
</main>
<footer>SCOUTOPS &middot; Campus issue &amp; maintenance operations</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var CATEGORIES = ['ELECTRICAL','PLUMBING','INTERNET','CLEANING','FURNITURE','EQUIPMENT','SECURITY','OTHER'];
  var PRIORITIES = ['LOW','MEDIUM','HIGH','CRITICAL'];
  var STATUSES = ['OPEN','ASSIGNED','IN_PROGRESS','RESOLVED','CLOSED'];
  var issues = [];
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;   // textContent => no HTML injection
    return e;
  }
  function label(v) { return v.replace('_', ' '); }
  function fill(sel, values, keepFirst) {
    if (!keepFirst) sel.textContent = '';
    values.forEach(function (v) { var o = el('option', '', label(v)); o.value = v; sel.appendChild(o); });
  }
  function toast(text, kind) {
    var m = el('div', 'msg ' + (kind === 'err' ? 'err' : 'ok'), text);
    $('toast').appendChild(m);
    setTimeout(function () { m.remove(); }, 4500);
  }
  function api(path, opts) {
    opts = opts || {};
    if (opts.body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(opts.body); }
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) {
          var detail = data.details ? ': ' + data.details.join('; ') : '';
          throw new Error((data.error || 'Request failed (' + r.status + ')') + detail);
        }
        return data;
      });
    });
  }

  // ---------------------------------------------------------- health
  function setPill(id, name, up) {
    var p = $(id);
    p.className = 'pill ' + (up ? 'up' : 'down');
    p.lastChild.textContent = name + ': ' + (up ? 'UP' : 'DOWN');
  }
  function checkHealth() {
    fetch('/health').then(function (r) { setPill('h-app', 'API', r.ok); }).catch(function () { setPill('h-app', 'API', false); });
    fetch('/health/db').then(function (r) { setPill('h-db', 'Database', r.ok); }).catch(function () { setPill('h-db', 'Database', false); });
  }

  // ---------------------------------------------------------- dashboard
  function renderStats() {
    var count = function (fn) { return issues.filter(fn).length; };
    var defs = [
      ['Total', issues.length, ''],
      ['Open', count(function (i) { return i.status === 'OPEN'; }), ''],
      ['In progress', count(function (i) { return i.status === 'ASSIGNED' || i.status === 'IN_PROGRESS'; }), 'warn'],
      ['Critical (active)', count(function (i) { return i.priority === 'CRITICAL' && i.status !== 'RESOLVED' && i.status !== 'CLOSED'; }), 'crit'],
      ['Resolved / closed', count(function (i) { return i.status === 'RESOLVED' || i.status === 'CLOSED'; }), 'good']
    ];
    var box = $('stats'); box.textContent = '';
    defs.forEach(function (d) {
      var s = el('div', 'stat ' + d[2]);
      s.appendChild(el('div', 'n', String(d[1])));
      s.appendChild(el('div', 'l', d[0]));
      box.appendChild(s);
    });
  }

  // ---------------------------------------------------------- list
  function fmt(d) { return new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); }
  function renderList() {
    var box = $('list'); box.textContent = '';
    if (!issues.length) {
      box.appendChild(el('div', 'empty', 'No issues found. Scouts are standing by - report one to begin a mission.'));
      return;
    }
    issues.forEach(function (i) {
      var card = el('article', 'issue p-' + i.priority);
      var top = el('div', 'meta');
      top.appendChild(el('span', 'tag mono', '#' + i.id));
      top.appendChild(el('span', 'tag t-' + i.priority, i.priority));
      top.appendChild(el('span', 'tag s-' + i.status, label(i.status)));
      top.appendChild(el('span', 'tag', i.category));
      card.appendChild(top);
      card.appendChild(el('h3', '', i.title));
      if (i.description) card.appendChild(el('p', 'desc', i.description));
      var meta = el('div', 'meta');
      meta.appendChild(el('span', '', 'Location: ' + i.location));
      meta.appendChild(el('span', '', 'Reporter: ' + i.reporter_name));
      meta.appendChild(el('span', '', 'Created: ' + fmt(i.created_at)));
      card.appendChild(meta);

      var act = el('div', 'actions');
      var sel = el('select'); sel.setAttribute('aria-label', 'Change status of issue ' + i.id);
      fill(sel, STATUSES); sel.value = i.status;
      sel.addEventListener('change', function () {
        sel.disabled = true;
        api('/api/issues/' + i.id + '/status', { method: 'PATCH', body: { status: sel.value } })
          .then(function () { toast('Issue #' + i.id + ' is now ' + label(sel.value)); load(); })
          .catch(function (e) { toast(e.message, 'err'); sel.value = i.status; sel.disabled = false; });
      });
      var edit = el('button', 'small', 'Edit');
      edit.addEventListener('click', function () { startEdit(i); });
      var del = el('button', 'small danger', 'Delete');
      del.addEventListener('click', function () {
        if (!confirm('Delete issue #' + i.id + ' "' + i.title + '"? This cannot be undone.')) return;
        del.disabled = true;
        api('/api/issues/' + i.id, { method: 'DELETE' })
          .then(function () { toast('Issue #' + i.id + ' deleted'); if ($('f-id').value === String(i.id)) resetForm(); load(); })
          .catch(function (e) { toast(e.message, 'err'); del.disabled = false; });
      });
      act.appendChild(sel); act.appendChild(edit); act.appendChild(del);
      card.appendChild(act);
      box.appendChild(card);
    });
  }

  function load() {
    var box = $('list');
    box.textContent = '';
    var l = el('div', 'loading'); l.appendChild(el('span', 'spinner')); l.appendChild(document.createTextNode('Scouting for issues...'));
    box.appendChild(l);
    var qs = [];
    [['status', 'flt-status'], ['priority', 'flt-priority'], ['category', 'flt-category']].forEach(function (p) {
      if ($(p[1]).value) qs.push(p[0] + '=' + encodeURIComponent($(p[1]).value));
    });
    api('/api/issues' + (qs.length ? '?' + qs.join('&') : ''))
      .then(function (data) { issues = data; renderStats(); renderList(); })
      .catch(function (e) {
        box.textContent = '';
        box.appendChild(el('div', 'empty', 'Could not load issues: ' + e.message));
        toast(e.message, 'err');
      });
    checkHealth();
  }

  // ---------------------------------------------------------- form
  function resetForm() {
    $('issue-form').reset();
    $('f-id').value = '';
    $('status-wrap').hidden = true;
    $('f-cancel').hidden = true;
    $('f-submit').textContent = 'Report issue';
    $('form-title').textContent = 'Report an issue';
    $('f-priority').value = 'MEDIUM';
  }
  function startEdit(i) {
    $('f-id').value = i.id;
    $('f-title').value = i.title; $('f-desc').value = i.description || '';
    $('f-category').value = i.category; $('f-priority').value = i.priority;
    $('f-location').value = i.location; $('f-reporter').value = i.reporter_name;
    $('f-status').value = i.status;
    $('status-wrap').hidden = false; $('f-cancel').hidden = false;
    $('f-submit').textContent = 'Save changes';
    $('form-title').textContent = 'Update issue #' + i.id;
    $('f-title').focus();
    $('form-title').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  $('issue-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var id = $('f-id').value;
    var body = {
      title: $('f-title').value, description: $('f-desc').value, category: $('f-category').value,
      priority: $('f-priority').value, location: $('f-location').value, reporter_name: $('f-reporter').value
    };
    if (id) body.status = $('f-status').value;
    var btn = $('f-submit'); btn.disabled = true;
    api(id ? '/api/issues/' + id : '/api/issues', { method: id ? 'PUT' : 'POST', body: body })
      .then(function (r) { toast(id ? 'Issue #' + r.id + ' updated' : 'Issue #' + r.id + ' reported'); resetForm(); load(); })
      .catch(function (e) { toast(e.message, 'err'); })
      .then(function () { btn.disabled = false; });
  });
  $('f-cancel').addEventListener('click', resetForm);
  $('refresh').addEventListener('click', load);
  ['flt-status', 'flt-priority', 'flt-category'].forEach(function (id) { $(id).addEventListener('change', load); });

  fill($('f-category'), CATEGORIES); fill($('f-priority'), PRIORITIES); fill($('f-status'), STATUSES);
  fill($('flt-status'), STATUSES, true); fill($('flt-priority'), PRIORITIES, true); fill($('flt-category'), CATEGORIES, true);
  $('f-priority').value = 'MEDIUM';
  load();
  setInterval(checkHealth, 30000);
})();
</script>
</body>
</html>
